services:
  ckt_bdd:
    container_name: ckt_bdd
    image: mariadb:12.1.2
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: toor
      MARIADB_DATABASE: bddname
      MARIADB_USER: roger
      MARIADB_PASSWORD: regor
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--innodb_initialized"]
      start_period: 5s
      interval: 10s
      timeout: 10s
      retries: 5

  ckt_adminer:
    container_name: ckt_adminer
    image: adminer
    ports:
      - 8080:8080

  ckt_backend_build:
    container_name: ckt_backend_build
    build: ./backend/.
    environment:
      BDD_HOST: ckt_bdd
    ports:
      - 12000:12000
    depends_on:
      ckt_bdd:
        condition: service_healthy
